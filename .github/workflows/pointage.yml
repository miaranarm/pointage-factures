name: Pointage des factures

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pointage-factures
  cancel-in-progress: false

jobs:
  pointage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et Tesseract OCR français/anglais
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
          tesseract --list-langs
          python -m pip install --upgrade pip

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Télécharger l'archive privée depuis la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/pointage-archive
          gh release download factures-a-pointer --repo "$GH_REPO" --pattern "pointage-input.zip" --dir /tmp/pointage-archive
          test -s /tmp/pointage-archive/pointage-input.zip

      - name: Extraire et vérifier les données
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from shutil import copyfileobj

          archive = Path("/tmp/pointage-archive/pointage-input.zip")
          with ZipFile(archive) as zf:
              members = zf.infolist()
              prefix = "pointage-input/"
              if not any(m.filename.startswith(prefix + "input/") for m in members):
                  prefix = ""

              for member in members:
                  name = member.filename
                  if prefix:
                      if not name.startswith(prefix):
                          continue
                      name = name[len(prefix):]
                  if not name:
                      continue

                  target = Path(name)
                  if target.is_absolute() or ".." in target.parts:
                      raise RuntimeError(f"Chemin non autorisé dans l'archive : {name}")

                  if member.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(member) as src, target.open("wb") as dst:
                          copyfileobj(src, dst)
          PY
          test -s input/P.MBS.xlsx
          test -s input/P.DISTRIMAX.xlsx
          test -d documents
          echo "Nombre de documents :"
          find documents -type f | wc -l
          echo "Vérification de la structure terminée."

      - name: Lancer le pointage
        run: python src/pointage.py --input input --documents documents --output output

      - name: Publier les résultats comme artefact temporaire
        if: always() && hashFiles('output/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: resultats-pointage
          path: output/
          if-no-files-found: warn
          retention-days: 7
