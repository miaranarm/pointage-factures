name: Pointage des factures

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pointage-factures
  cancel-in-progress: false

jobs:
  pointage:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et Tesseract OCR français/anglais
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-eng
          tesseract --list-langs
          python -m pip install --upgrade pip

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt

      - name: Télécharger l'archive privée depuis la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/pointage-archive
          gh release download factures-a-pointer --repo "$GH_REPO" --pattern "pointage-input.zip" --dir /tmp/pointage-archive
          test -s /tmp/pointage-archive/pointage-input.zip

      - name: Extraire et vérifier les données
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          from shutil import copyfileobj

          archive = Path("/tmp/pointage-archive/pointage-input.zip")
          extracted = 0
          selected = 0

          with ZipFile(archive) as zf:
              members = zf.infolist()
              print(f"Entrées dans l'archive : {len(members)}", flush=True)
              print("Premiers chemins de l'archive :", flush=True)
              for member in members[:30]:
                  print(repr(member.filename), flush=True)
              print("Tous les fichiers Excel de l'archive :", flush=True)
              for member in members:
                  if member.filename.lower().endswith((".xlsx", ".xls")):
                      print(repr(member.filename), flush=True)

              for member in members:
                  parts = PurePosixPath(member.filename).parts
                  start = next((i for i, part in enumerate(parts) if part in ("input", "documents")), None)
                  if start is None:
                      continue

                  selected += 1
                  target = Path(*parts[start:])
                  if target.is_absolute() or ".." in target.parts:
                      raise RuntimeError(f"Chemin non autorisé dans l'archive : {member.filename}")

                  if member.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(member) as src, target.open("wb") as dst:
                          copyfileobj(src, dst)
                      extracted += 1

          print(f"Entrées retenues : {selected}; fichiers extraits : {extracted}", flush=True)
          print("Fichiers présents dans input :", [p.name for p in Path("input").glob("*")] if Path("input").exists() else "DOSSIER ABSENT", flush=True)
          test_mbs = Path("input/P.MBS.xlsx")
          test_dist = Path("input/P.DISTRIMAX.xlsx")
          if not test_mbs.is_file() or test_mbs.stat().st_size == 0:
              raise SystemExit(f"Fichier manquant ou vide : {test_mbs}")
          if not test_dist.is_file() or test_dist.stat().st_size == 0:
              raise SystemExit(f"Fichier manquant ou vide : {test_dist}")
          if not Path("documents").is_dir():
              raise SystemExit("Dossier documents absent")
          document_count = sum(1 for p in Path("documents").rglob("*") if p.is_file())
          print(f"Nombre de documents : {document_count}", flush=True)
          if document_count == 0:
              raise SystemExit("Aucun document trouvé dans documents/")
          print("Vérification de la structure terminée.", flush=True)
          PY

      - name: Lancer le pointage
        run: python src/pointage.py --input input --documents documents --output output

      - name: Publier les résultats comme artefact temporaire
        if: always() && hashFiles('output/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: resultats-pointage
          path: output/
          if-no-files-found: warn
          retention-days: 7
